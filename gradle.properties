org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The connected test task uninstalls the app when it finishes, which strips the phone of the
# remote and wipes its Fix Keys findings. Keep the APKs installed instead; a re-install over the
# top preserves app data.
android.injected.androidTest.leaveApksInstalledAfterRun=true
